<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        .box {
            background-color: white;
            width: 350px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 80%;
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Student Grade Calculator</h2>

        <input type="text" id="name" placeholder="Enter Student Name">

        <input type="number" id="m1" placeholder="Subject 1 Marks">
        <input type="number" id="m2" placeholder="Subject 2 Marks">
        <input type="number" id="m3" placeholder="Subject 3 Marks">
        <input type="number" id="m4" placeholder="Subject 4 Marks">
        <input type="number" id="m5" placeholder="Subject 5 Marks">

        <br>

        <button onclick="calculateResult()">Calculate Result</button>

        <div id="result"></div>
    </div>

    <script>
        function calculateResult() {

            // Get marks from input fields
            let name = document.getElementById("name").value;

            let m1 = Number(document.getElementById("m1").value);
            let m2 = Number(document.getElementById("m2").value);
            let m3 = Number(document.getElementById("m3").value);
            let m4 = Number(document.getElementById("m4").value);
            let m5 = Number(document.getElementById("m5").value);

            // Calculate total and percentage
            let total = m1 + m2 + m3 + m4 + m5;
            let percentage = total / 5;

            // Calculate grade
            let grade;

            if (percentage >= 90) {
                grade = "A+";
            }
            else if (percentage >= 80) {
                grade = "A";
            }
            else if (percentage >= 70) {
                grade = "B";
            }
            else if (percentage >= 60) {
                grade = "C";
            }
            else if (percentage >= 50) {
                grade = "D";
            }
            else {
                grade = "F";
            }

            // Display result
            document.getElementById("result").innerHTML =
                "<b>Student Name:</b> " + name +
                "<br><b>Total Marks:</b> " + total + " / 500" +
                "<br><b>Percentage:</b> " + percentage + "%" +
                "<br><b>Grade:</b> " + grade;
        }
    </script>

</body>
</html>
