<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HeritageQuest</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body id="body"
    class="bg-amber-50 text-gray-800 min-h-screen">

    <!-- ================= HEADER ================= -->

    <header class="bg-stone-900 text-white p-5">

        <div class="max-w-5xl mx-auto flex justify-between items-center">

            <div>
                <h1 class="text-2xl font-bold">
                    🏛️ HeritageQuest
                </h1>

                <p class="text-sm text-gray-300">
                    My Historical Journey
                </p>
            </div>

            <button onclick="changeTheme()"
                class="bg-amber-600 px-3 py-2 rounded-lg">

                🌙 Theme

            </button>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="max-w-5xl mx-auto p-5">

        <!-- Introduction -->

        <section class="text-center mb-8">

            <h2 class="text-3xl font-bold text-stone-800">
                Explore History 📖
            </h2>

            <p class="text-gray-600 mt-2">
                Keep track of historical books and places
                that interest you.
            </p>

        </section>


        <!-- ================= STATISTICS ================= -->

        <section class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">

            <div class="bg-white p-4 rounded-xl shadow text-center">

                <p>📚 Books</p>

                <h2 id="bookTotal"
                    class="text-2xl font-bold text-amber-700">
                    0
                </h2>

            </div>


            <div class="bg-white p-4 rounded-xl shadow text-center">

                <p>✅ Read</p>

                <h2 id="readTotal"
                    class="text-2xl font-bold text-green-600">
                    0
                </h2>

            </div>


            <div class="bg-white p-4 rounded-xl shadow text-center">

                <p>🏛️ Places</p>

                <h2 id="placeTotal"
                    class="text-2xl font-bold text-blue-600">
                    0
                </h2>

            </div>


            <div class="bg-white p-4 rounded-xl shadow text-center">

                <p>📍 Visited</p>

                <h2 id="visitedTotal"
                    class="text-2xl font-bold text-purple-600">
                    0
                </h2>

            </div>

        </section>


        <!-- ================= FORMS ================= -->

        <section class="grid md:grid-cols-2 gap-6 mb-8">


            <!-- BOOK FORM -->

            <div class="bg-white p-6 rounded-xl shadow">

                <h2 class="text-xl font-bold mb-4">
                    📚 Add a Book
                </h2>

                <input
                    id="bookName"
                    type="text"
                    placeholder="Book name"
                    class="w-full border p-3 rounded-lg mb-3">

                <input
                    id="author"
                    type="text"
                    placeholder="Author name"
                    class="w-full border p-3 rounded-lg mb-3">

                <button onclick="addBook()"
                    class="w-full bg-amber-700
                           text-white p-3 rounded-lg">

                    Add Book

                </button>

            </div>


            <!-- PLACE FORM -->

            <div class="bg-white p-6 rounded-xl shadow">

                <h2 class="text-xl font-bold mb-4">
                    🏛️ Add a Place
                </h2>

                <input
                    id="placeName"
                    type="text"
                    placeholder="Historical place"
                    class="w-full border p-3 rounded-lg mb-3">

                <input
                    id="placeLocation"
                    type="text"
                    placeholder="Location"
                    class="w-full border p-3 rounded-lg mb-3">

                <button onclick="addPlace()"
                    class="w-full bg-stone-800
                           text-white p-3 rounded-lg">

                    Add Place

                </button>

            </div>

        </section>


        <!-- ================= SEARCH ================= -->

        <input
            id="search"
            onkeyup="showData()"
            type="text"
            placeholder="🔍 Search book or place..."
            class="w-full border p-3 rounded-lg mb-6">


        <!-- ================= LIST ================= -->

        <section>

            <h2 class="text-2xl font-bold mb-4">
                My Collection
            </h2>

            <div id="list"
                class="grid md:grid-cols-2 gap-4">
            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="bg-stone-900 text-white
                   text-center p-5 mt-10">

        <p>
            🏛️ HeritageQuest | My Love for History
        </p>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        // ------------------------------------------
        // STEP 1: Get saved data
        // ------------------------------------------

        let books =
            JSON.parse(localStorage.getItem("books")) || [];

        let places =
            JSON.parse(localStorage.getItem("places")) || [];


        // ------------------------------------------
        // STEP 2: Add Book
        // ------------------------------------------

        function addBook() {

            let name =
                document.getElementById("bookName").value;

            let author =
                document.getElementById("author").value;


            // Check empty input

            if (name === "" || author === "") {

                alert("Please enter book name and author.");

                return;

            }


            // Create book object

            let book = {

                name: name,

                author: author,

                read: false

            };


            // Add book to array

            books.push(book);


            // Save data

            saveData();


            // Clear inputs

            document.getElementById("bookName").value = "";

            document.getElementById("author").value = "";


            // Display

            showData();

        }


        // ------------------------------------------
        // STEP 3: Add Place
        // ------------------------------------------

        function addPlace() {

            let name =
                document.getElementById("placeName").value;

            let location =
                document.getElementById("placeLocation").value;


            if (name === "" || location === "") {

                alert("Please enter place and location.");

                return;

            }


            // Create place object

            let place = {

                name: name,

                location: location,

                visited: false

            };


            // Add to array

            places.push(place);


            // Save

            saveData();


            // Clear inputs

            document.getElementById("placeName").value = "";

            document.getElementById("placeLocation").value = "";


            showData();

        }


        // ------------------------------------------
        // STEP 4: Save data
        // ------------------------------------------

        function saveData() {

            localStorage.setItem(
                "books",
                JSON.stringify(books)
            );

            localStorage.setItem(
                "places",
                JSON.stringify(places)
            );

        }


        // ------------------------------------------
        // STEP 5: Display data
        // ------------------------------------------

        function showData() {

            let list =
                document.getElementById("list");


            let search =
                document
                .getElementById("search")
                .value
                .toLowerCase();


            list.innerHTML = "";


            // Show Books

            books.forEach(function(book, index) {

                if (
                    book.name
                    .toLowerCase()
                    .includes(search)
                ) {

                    list.innerHTML += `

                        <div class="bg-white p-5
                                    rounded-xl shadow
                                    border-l-4
                                    border-amber-600">

                            <h3 class="text-xl font-bold">
                                📚 ${book.name}
                            </h3>

                            <p class="text-gray-500">
                                Author: ${book.author}
                            </p>

                            <p class="mt-2">

                                ${
                                    book.read
                                    ? "✅ Read"
                                    : "📖 Not Read"
                                }

                            </p>

                            <div class="mt-4 flex gap-2">

                                <button
                                    onclick="markBook(${index})"
                                    class="bg-green-600
                                           text-white
                                           px-3 py-2
                                           rounded-lg">

                                    ${book.read
                                    ? "Mark Unread"
                                    : "Mark Read"}

                                </button>

                                <button
                                    onclick="deleteBook(${index})"
                                    class="bg-red-500
                                           text-white
                                           px-3 py-2
                                           rounded-lg">

                                    Delete

                                </button>

                            </div>

                        </div>

                    `;

                }

            });


            // Show Places

            places.forEach(function(place, index) {

                if (
                    place.name
                    .toLowerCase()
                    .includes(search)
                ) {

                    list.innerHTML += `

                        <div class="bg-white p-5
                                    rounded-xl shadow
                                    border-l-4
                                    border-blue-600">

                            <h3 class="text-xl font-bold">
                                🏛️ ${place.name}
                            </h3>

                            <p class="text-gray-500">
                                📍 ${place.location}
                            </p>

                            <p class="mt-2">

                                ${
                                    place.visited
                                    ? "✅ Visited"
                                    : "🗺️ Not Visited"
                                }

                            </p>

                            <div class="mt-4 flex gap-2">

                                <button
                                    onclick="markPlace(${index})"
                                    class="bg-blue-600
                                           text-white
                                           px-3 py-2
                                           rounded-lg">

                                    ${place.visited
                                    ? "Mark Unvisited"
                                    : "Mark Visited"}

                                </button>

                                <button
                                    onclick="deletePlace(${index})"
                                    class="bg-red-500
                                           text-white
                                           px-3 py-2
                                           rounded-lg">

                                    Delete

                                </button>

                            </div>

                        </div>

                    `;

                }

            });


            updateStats();

        }


        // ------------------------------------------
        // STEP 6: Mark Book Read
        // ------------------------------------------

        function markBook(index) {

            books[index].read =
                !books[index].read;

            saveData();

            showData();

        }


        // ------------------------------------------
        // STEP 7: Mark Place Visited
        // ------------------------------------------

        function markPlace(index) {

            places[index].visited =
                !places[index].visited;

            saveData();

            showData();

        }


        // ------------------------------------------
        // STEP 8: Delete Book
        // ------------------------------------------

        function deleteBook(index) {

            books.splice(index, 1);

            saveData();

            showData();

        }


        // ------------------------------------------
        // STEP 9: Delete Place
        // ------------------------------------------

        function deletePlace(index) {

            places.splice(index, 1);

            saveData();

            showData();

        }


        // ------------------------------------------
        // STEP 10: Update Statistics
        // ------------------------------------------

        function updateStats() {

            document.getElementById("bookTotal")
                .innerText = books.length;


            document.getElementById("placeTotal")
                .innerText = places.length;


            let readBooks =
                books.filter(function(book) {

                    return book.read;

                }).length;


            let visitedPlaces =
                places.filter(function(place) {

                    return place.visited;

                }).length;


            document.getElementById("readTotal")
                .innerText = readBooks;


            document.getElementById("visitedTotal")
                .innerText = visitedPlaces;

        }


        // ------------------------------------------
        // STEP 11: Dark Mode
        // ------------------------------------------

        function changeTheme() {

            let body =
                document.getElementById("body");

            body.classList.toggle("bg-amber-50");

            body.classList.toggle("bg-gray-900");

            body.classList.toggle("text-gray-800");

            body.classList.toggle("text-white");

        }


        // ------------------------------------------
        // STEP 12: Display when page opens
        // ------------------------------------------

        showData();

    </script>

</body>

</html>
